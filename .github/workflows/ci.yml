# Flipper V2 as applied by the Pico specification: every pull request runs
# the typography scan, the protocol checks, the host tests under warnings as
# errors, the sanitiser build, a short fuzz run, the development peer build,
# and the firmware build against the pinned SDK and compiler.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repository-checks:
    name: typography scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_typography.py
      - run: python3 scripts/generate_protocol_tables.py --check
      - run: python3 scripts/check_protocol_definition.py

  host-tests:
    name: host tests and sanitiser build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gcc --version
      - run: make test
      - run: make test-sanitise
      - run: make fuzz-sanitise FUZZ_ITERATIONS=200000
      - run: make peer

  firmware-build:
    name: firmware build against the pinned SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      # The same scripts the development machine runs: the first downloads the
      # pinned compiler, verifies Arm's digest, and clones the pinned SDK.
      # Invoked through bash because the repository is edited on Windows, where
      # git records no executable bit.
      - run: bash scripts/setup_toolchain.sh
      - run: bash scripts/build_firmware.sh
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*.uf2
